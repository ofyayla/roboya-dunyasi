# Local development services. Synthetic data only (ADR 0001).
name: roboya
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roboya
      POSTGRES_PASSWORD: roboya
      POSTGRES_DB: roboya
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roboya"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
