name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml .

  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roboya
          POSTGRES_PASSWORD: roboya
          POSTGRES_DB: roboya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roboya" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    env:
      ROBOYA_DATABASE_URL: postgresql+asyncpg://roboya:roboya@localhost:5432/roboya_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest

  engine:
    name: Coding engine + validator (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Engine tests with ≥ 90% line coverage
        run: make test-engine DOTNET=dotnet
      - name: Validator tests
        run: dotnet test tools/engine-dotnet/Roboya.LevelValidator.Tests --nologo

  content:
    name: Content, schema and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: npm test -w @roboya/level-schema
      - name: TTS tool tests
        run: make test-tools
      - name: Validate levels (schema + solver + voice keys)
        run: make validate-content DOTNET=dotnet
      - name: Generated code is up to date
        run: make check-gen

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run test --workspaces --if-present
      - run: npm run build --workspaces --if-present

  unity-editmode:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # the test runner publishes results as a check run
    # Needs a Unity licence in repository secrets (see docs/ci.md); forks never receive secrets.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check prerequisites
        id: pre
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ ! -f apps/game/ProjectSettings/ProjectVersion.txt ]; then
            echo "Unity project not created yet; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$UNITY_LICENSE" ]; then
            echo "::warning::UNITY_LICENSE secret missing; Unity tests skipped."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: steps.pre.outputs.run == 'true'
        with:
          path: apps/game/Library
          key: unity-library-${{ hashFiles('apps/game/Packages/packages-lock.json', 'apps/game/ProjectSettings/ProjectVersion.txt') }}
      - name: "[diag] start monitors"
        if: steps.pre.outputs.run == 'true'
        run: |
          mkdir -p /tmp/diag
          du -sh apps/game/Library apps/game/Library/* 2>/dev/null | sort -h | tail -15
          ls -la apps/game/Library/DataStore 2>/dev/null | head -40 || true
          df -h / /dev/shm; free -m; nproc; lscpu | grep -i "model name"
          cat /proc/sys/vm/overcommit_memory /proc/sys/kernel/pid_max
          nohup docker events --format '{{.Time}} {{.Type}} {{.Action}} {{.Actor.Attributes.exitCode}} {{.Actor.Attributes.name}}' > /tmp/diag/events.log 2>&1 &
          nohup sh -c 'while true; do date +%T.%N; free -m | sed -n 2,3p; df -m / /dev/shm | tail -2; for c in $(docker ps -q); do docker exec $c sh -c "df -m /dev/shm | tail -1; ps -eo pid,rss,vsz,comm --sort=-rss | head -6" 2>/dev/null; done; sleep 0.5; done' > /tmp/diag/mon.log 2>&1 &
          sudo dmesg -T | tail -5 > /tmp/diag/dmesg-before.log
      - uses: game-ci/unity-test-runner@v4
        if: steps.pre.outputs.run == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: apps/game
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode results
      - name: "[diag] dump"
        if: always() && steps.pre.outputs.run == 'true'
        run: |
          echo "== dmesg"; sudo dmesg -T | grep -iE "kill|oom|memory|cgroup|segfault|Unity" | tail -60
          echo "== docker events"; cat /tmp/diag/events.log
          echo "== monitor (last 400 lines)"; tail -400 /tmp/diag/mon.log
          df -h / ; free -m
